[paths]
environments_path = "./environments"
extensions_dirs = ["extensions"]

[build]
skip_base_generation = true
extensions = ["stub-upstream", "url-discovery", "stdio-upstream"]

[build.combos]
entire = ["stub-upstream", "url-discovery", "stdio-upstream"]

[build.environments]
available = ["forwarding"]

[build.environments.forwarding]
extensions = []
combos = ["entire"]
