[paths]
environments_path = "./environments"
extensions_dirs = ["extensions"]

[build]
skip_base_generation = true
extensions = ["stub-mcp-upstream", "publish-gateway-url-discovery", "mcp-gateway-stdio"]

[build.combos]
# entire = the functional base: gateway + the stub upstream the gate needs
# + the two confirmed extensions.
entire = ["stub-mcp-upstream", "publish-gateway-url-discovery", "mcp-gateway-stdio"]

[build.environments]
available = ["forwarding"]

[build.environments.forwarding]
extensions = []
combos = ["entire"]
