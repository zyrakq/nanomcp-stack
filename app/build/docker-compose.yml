x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: ${LOG_MAX_FILE:-3}
    compress: ${LOG_COMPRESS:-true}
services:
  nanomcp:
    container_name: nanomcp
    image: ${IMAGE:-localhost/nanomcp:0.1.0}
    restart: unless-stopped
    logging: *default-logging
    environment:
      # Inbound token callers must present (inbound=token mode); seeded into
      # the credential store at container start. Empty = inbound stays off.
      NANOMCP_SEED_INBOUND_TOKEN: ${NANOMCP_SEED_INBOUND_TOKEN:-}
      TZ: ${TZ:-UTC}
      # MCP URL the gateway seeds the stub upstream with (inside
      # nanomcp-network). Set to empty to skip stub seeding.
      NANOMCP_SEED_STUB_URL: ${NANOMCP_SEED_STUB_URL:-http://stub-mcp-upstream:8080/mcp}
    volumes:
      - nanomcp-userdata:/home/nanomcp/.local/share/nanomcp/userdata
    healthcheck:
      # /healthz needs the bearer in token mode; accept any HTTP answer
      # (200 in off mode, 401 in token mode — no --fail). dash has no
      # /dev/tcp, so a shell TCP probe would never work.
      test: ["CMD-SHELL", "curl -s -o /dev/null -m 4 http://127.0.0.1:7331/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - nanomcp-network
    ports:
      # The container always listens on relay port 7332 (socat ->
      # 127.0.0.1:7331); only the host side is configurable.
      - "${NANOMCP_PORT:-7332}:7332"
    depends_on:
      stub-mcp-upstream:
        condition: service_healthy
  # Minimal streamable-HTTP MCP upstream (required-for-gate): lets the
  # gateway aggregate at least one real upstream so the functional gate can
  # verify initialize -> tools/list -> tools/call end to end.
  stub-mcp-upstream:
    container_name: stub-mcp-upstream
    image: python:3-alpine
    restart: unless-stopped
    command:
      - /bin/sh
      - -c
      - |
        cat > /tmp/stub.py <<'PY'
        import json
        from http.server import BaseHTTPRequestHandler, HTTPServer

        PROTOCOL = "2025-06-18"
        TOOLS = [{
            "name": "echo",
            "description": "Echo back the input text",
            "inputSchema": {
                "type": "object",
                "properties": {"text": {"type": "string"}},
                "required": ["text"],
            },
        }]

        class Handler(BaseHTTPRequestHandler):
            def _send(self, status, body=b"", ctype="application/json", extra=None):
                self.send_response(status)
                self.send_header("Content-Type", ctype)
                self.send_header("Content-Length", str(len(body)))
                for k, v in (extra or {}).items():
                    self.send_header(k, v)
                self.end_headers()
                if body:
                    self.wfile.write(body)

            def do_GET(self):
                if self.path == "/healthz":
                    self._send(200, b"ok", "text/plain")
                else:
                    self._send(404)

            def do_POST(self):
                if self.path != "/mcp":
                    return self._send(404)
                try:
                    length = int(self.headers.get("Content-Length", 0))
                    req = json.loads(self.rfile.read(length) or b"{}")
                except Exception:
                    return self._send(400)
                method = req.get("method", "")
                rid = req.get("id")
                if rid is None:  # notification
                    return self._send(202)
                if method == "initialize":
                    result = {
                        "protocolVersion": PROTOCOL,
                        "capabilities": {"tools": {}},
                        "serverInfo": {"name": "stub-mcp-upstream", "version": "0.1.0"},
                    }
                    return self._send(200, json.dumps({"jsonrpc": "2.0", "id": rid, "result": result}).encode(),
                                      extra={"Mcp-Session-Id": "stub-session"})
                if method == "tools/list":
                    return self._send(200, json.dumps({"jsonrpc": "2.0", "id": rid, "result": {"tools": TOOLS}}).encode())
                if method == "tools/call":
                    text = (req.get("params", {}).get("arguments", {}) or {}).get("text", "")
                    result = {"content": [{"type": "text", "text": "echo: " + text}]}
                    return self._send(200, json.dumps({"jsonrpc": "2.0", "id": rid, "result": result}).encode())
                return self._send(200, json.dumps(
                    {"jsonrpc": "2.0", "id": rid,
                     "error": {"code": -32601, "message": "method not found: " + method}}).encode())

            def log_message(self, *args):
                pass

        HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
        PY
        exec python3 /tmp/stub.py
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - nanomcp-network
networks:
  nanomcp-network:
    name: nanomcp-network
    driver: bridge
volumes:
  nanomcp-userdata:
    name: nanomcp-userdata
