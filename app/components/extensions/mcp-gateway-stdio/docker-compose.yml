services:
  nanomcp:
    environment:
      # Built-in stdio helper upstream: 1 = the entrypoint seeds a
      # servers.json entry (id "stdio-helper", alias "stdio-helper") whose
      # command is the in-image mcp-stdio-echo helper — a minimal MCP stdio
      # server (one echo tool) the gateway spawns as a child process inside
      # its own container (transport_stdio.zig; a sidecar container cannot
      # be the child). Empty = not seeded.
      NANOMCP_STDIO_HELPER: ${NANOMCP_STDIO_HELPER:-1}
      # Generic stdio upstream seeding: a complete servers.json server object
      # (transport "stdio"; command required, resolved inside the gateway
      # container via the child's PATH; args/env optional). For real stdio
      # upstreams beyond the built-in helper — the runtime a command needs
      # (node/python/...) must be present in the image. Empty = not seeded;
      # GUI-managed entries are never touched. Example:
      #   NANOMCP_SEED_STDIO_JSON={"id":"weather","name":"Weather","alias":"weather","transport":"stdio","enabled":true,"command":"uvx","args":["mcp-server-fetch"]}
      NANOMCP_SEED_STDIO_JSON: ${NANOMCP_SEED_STDIO_JSON:-}
