services:
  nanomcp:
    environment:
      # Host-published gateway port. The entrypoint seeds it into
      # servers.json .port — the only config surface the binary reads — so
      # every /.well-known/oauth-* metadata document advertises
      # http://127.0.0.1:<port> matching the host-published URL. Empty =
      # inert (default port 7331). Must equal NANOMCP_PORT and differ from
      # the relay listen port 7332.
      NANOMCP_PUBLIC_PORT: ${NANOMCP_PUBLIC_PORT:-}
    healthcheck:
      # Scalar string (not an array): yq's *+ merge appends arrays, so only
      # a scalar overrides the base test. Probes the configured port.
      test: "curl -s -o /dev/null -m 4 http://127.0.0.1:${NANOMCP_PUBLIC_PORT:-7331}/healthz"
